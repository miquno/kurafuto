# Build graph for XcodeGen. Edit this file, then run `xcodegen generate`.
# Kurafuto.xcodeproj is generated and not committed.
name: Kurafuto
options:
  bundleIdPrefix: dev.miquno
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/BuildConfig.xcconfig
  Release: Configs/BuildConfig.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Kurafuto:
    type: application
    platform: iOS
    sources:
      - path: Kurafuto
        excludes:
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
    info:
      path: Kurafuto/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kurafuto
        CFBundleDevelopmentRegion: en
        # Matches Theme.background in the default dark mode, so launch does not flash white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: "Kurafuto connects to your self-hosted server panel on your local network."
        NSFaceIDUsageDescription: "Unlock Kurafuto with Face ID before controlling your servers."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.miquno.kurafuto
        # No app icon yet; the asset catalog only holds the launch background.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  KurafutoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KurafutoTests
        excludes:
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
    dependencies:
      - target: Kurafuto
schemes:
  Kurafuto:
    build:
      targets:
        Kurafuto: all
    run:
      # Starts the app on MockCraftyService. Remove to test against a real panel.
      commandLineArguments:
        "-mock": true
    test:
      targets: [KurafutoTests]
